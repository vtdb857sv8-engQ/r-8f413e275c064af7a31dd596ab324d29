name: Package iPhone IPA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-first.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract source package
        run: unzip -qo IDV-source.zip
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build and package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p dist
          xcodebuild -project ios/IDV.xcodeproj -scheme IDV -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dist/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee dist/build.log
          app='dist/DerivedData/Build/Products/Release-iphoneos/IDV.app'
          test -x "$app/IDV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          xcrun lipo "$app/IDV" -verify_arch arm64
          mkdir -p dist/package/Payload
          ditto "$app" dist/package/Payload/IDV.app
          (cd dist/package && /usr/bin/zip -qry ../IDV-unsigned.ipa Payload)
          /usr/bin/unzip -t dist/IDV-unsigned.ipa
          shasum -a 256 dist/IDV-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: IDV-unsigned-package-${{ github.run_number }}
          path: dist/IDV-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload package build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IDV-package-log-${{ github.run_number }}
          path: dist/build.log
          if-no-files-found: ignore
          retention-days: 7
